name: AkiSpot Browser QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Exercise mobile, tablet, desktop and conditional routes
        run: python tests/browser.test.py
      - name: Preserve mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akispot-browser-preview
          path: mobile-preview.png
          if-no-files-found: ignore
