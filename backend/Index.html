const csv=el('button','btn secondary','CSV保存');csv.type='button';csv.addEventListener('click',()=>{download('AkiSpot_アンケート回答.csv',exportCSV(),'text/csv;charset=utf-8');setStatus('CSVの保存処理を開始しました。')});const cp=el('button','btn secondary','回答をコピー');cp.type='button';cp.addEventListener('click',()=>{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(summaryText()).then(()=>setStatus('回答をコピーしました。')).catch(showCopy)}else showCopy()});actions.append(csv,cp);const reset=el('button','btn secondary wide','この端末の回答を消して最初から');reset.type='button';reset.addEventListener('click',()=>{if(!confirm('この端末に保存した回答を消去して最初から始めますか？ 送信済みの回答は調査用シートから削除されません。'))return;answers={};current='intro';submitted=false;receipt='';requestId=newRequestId();try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY)}catch(e){}render();window.scrollTo(0,0);});actions.append(reset);root.append(actions);const status=el('p','status');status.id='status';status.setAttribute('role','status');root.append(status);const fb=el('div');fb.id='fallback';fb.hidden=true;fb.append(el('p','helper','下のテキストを選択・コピーしてください。'));const tx=el('textarea','fallback');tx.id='fallbackText';tx.readOnly=true;tx.value=summaryText();fb.append(tx);root.append(fb);function showCopy(){fb.hidden=false;tx.focus();tx.select();setStatus('テキスト欄からコピーしてください。')}function setStatus(message){status.textContent=message}const notice=el('div','notice '+(!appMode?'warn':''));notice.textContent=appMode?'「回答を送信する」を押すと、授業の集計用スプレッドシートに回答が保存されます。入力しただけでは送信されません。':'重要：このHTMLファイルでは回答は送信されません。調査者が回答を集めるには、公開用WebアプリのURLを配布してください。';root.append(notice);}
function render(){if(current!=='intro'&&current!=='finish'&&!route().includes(current))current='intro';$main.replaceChildren();progress();const mode=current==='intro'?'home':current==='finish'?'end':QS[current].scene;story(mode);const back=byId('back'),next=byId('next');back.hidden=current==='intro'||(current==='finish'&&submitted);next.hidden=current==='finish';next.textContent=current==='intro'?'回答を始める':current==='finish'?'':current===route()[route().length-1]?'回答内容を確認する':'次へ進む';if(current==='intro')rowIntro($main);else if(current==='finish')makeFinish($main);else makeQuestion($main,current);save();const isApp=!!(window.google&&google.script&&google.script.run);byId('navNote').textContent=!savedFlag?'この端末では途中保存できません。離れる前に回答を控えてください。':current==='finish'?(submitted?'送信済みです。':'まだ送信されていません。'+(isApp?'画面内の送信ボタンを押してください。':'HTML試用版では送信できません。')):current==='intro'?'入力内容はこのブラウザに一時保存されます（保存設定によります）。':(isApp?'途中保存中。回答送信は最後の確認画面で行います。':'途中保存中。HTML試用版は送信されません。');}
function goto(key){current=key;render();window.scrollTo(0,0);try{$main.focus({preventScroll:true})}catch(e){}}
byId('back').addEventListener('click',()=>{if(current==='finish'&&submitted)return;if(current==='finish')return goto(route().slice(-1)[0]);const r=route();const index=r.indexOf(current);goto(index>0?r[index-1]:'intro');});
byId('next').addEventListener('click',()=>{if(current==='intro')return goto('Q0');if(current==='finish')return; if(!isValid(current)){const e=byId('error');e.textContent=QS[current].type==='matrix'?'すべての行について1〜5から回答してください。':'回答を選択してください。「その他」を選んだ場合は内容も入力してください。';e.scrollIntoView({block:'center'});return;}const r=route(),i=r.indexOf(current);goto(i===r.length-1?'finish':r[i+1]);});
load();render();
